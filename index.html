<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Allenamento Log</title>
<meta name="description" content="Registra rapidamente esercizi e ripetizioni durante l'allenamento.">

<!-- Tema browser -->
<meta name="theme-color" content="#161A20">

<!-- iOS: esecuzione a schermo intero come app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamento">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Android / PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #161A20;
    --text: #EDEDE6;
    --muted: #8A8F98;
    --line: #333A44;
    --accent: #4C7BFF;
    --success: #4CD787;
    --error: #FF6B6B;
    --nav-height: 64px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 420px;
    margin: 0 auto;
  }

  header { margin-bottom: 32px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  .subtitle { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .field { margin-bottom: 28px; }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    color: var(--text);
    font-size: 1.25rem;
    padding: 8px 2px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    padding: 10px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  select {
    width: 100%;
    appearance: none;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    color: var(--text);
    font-size: 1.1rem;
    padding: 8px 2px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  select:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  select:disabled { color: var(--muted); opacity: 1; }

  input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .weight-row {
    display: flex;
    align-items: flex-end;
    gap: 20px;
  }

  .weight-row > label:first-child { flex: 1; }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }

  .checkbox-label input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
  }

  input::placeholder,
  textarea::placeholder { color: #4A505A; }

  button {
    width: 100%;
    min-height: 52px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #0B0D11;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  #status, #exerciseStatus, #endpointStatus {
    text-align: center;
    min-height: 20px;
    margin-top: 16px;
    font-size: 0.9rem;
    overflow-wrap: anywhere;
  }
  .pending { color: var(--muted); }
  .success { color: var(--success); }
  .error { color: var(--error); }

  /* Avviso mostrato quando i menu non arrivano da Google Sheets */
  .notice {
    display: none;
    align-items: center;
    gap: 12px;
    border: 1px solid var(--error);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 24px;
    color: var(--error);
    font-size: 0.85rem;
    line-height: 1.4;
  }
  .notice.visible { display: flex; }
  .notice p { margin: 0; flex: 1; }
  .notice button {
    width: auto;
    min-height: 36px;
    padding: 8px 14px;
    font-size: 0.8rem;
    border-radius: 8px;
    flex-shrink: 0;
  }

  /* Seconda schermata: una card per ogni gruppo del menu */
  .group-card {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .group-name {
    flex: 1;
    min-width: 0;
    margin: 0;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    overflow-wrap: anywhere;
  }

  .group-header input { flex: 1; min-width: 0; font-size: 1.05rem; }
  .group-empty { margin: 10px 0 0; color: var(--muted); font-size: 0.85rem; }

  .exercise-list { margin: 8px 0 0; padding: 0; list-style: none; }
  .exercise-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  .exercise-list li:first-child { border-top: none; }
  .exercise-name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .exercise-list li input { flex: 1; min-width: 0; font-size: 0.95rem; padding: 4px 2px; }

  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .icon-button {
    width: 36px;
    min-height: 36px;
    padding: 0;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1;
  }
  .icon-button:active { transform: scale(0.94); }
  .icon-button.danger { color: var(--error); border-color: var(--error); }
  .icon-button.confirm { color: var(--success); border-color: var(--success); }

  .add-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .add-row label { margin: 0; }
  .add-row input { flex: 1; min-width: 0; font-size: 0.95rem; }
  .add-row button {
    width: auto;
    min-height: 40px;
    padding: 0 16px;
    font-size: 0.85rem;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .settings {
    margin-top: 28px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .settings summary {
    color: var(--muted);
    font-size: 0.85rem;
    cursor: pointer;
    list-style: none;
  }
  .settings summary::-webkit-details-marker { display: none; }
  .settings summary::before { content: '⚙ '; }
  .settings p { color: var(--muted); font-size: 0.8rem; line-height: 1.45; }
  .settings input { font-size: 0.85rem; }

  /* Schermate affiancate, navigabili con swipe o bottom nav */
  .screens-viewport {
    flex: 1;
    overflow: hidden;
    touch-action: pan-y;
  }

  .screens {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.3s ease;
  }

  .screen {
    width: 50%;
    height: 100%;
    flex-shrink: 0;
    overflow-y: auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      24px
      max(24px, env(safe-area-inset-left));
  }

  .bottom-nav {
    display: flex;
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg);
  }

  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: var(--nav-height);
    padding: 8px 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
  }

  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 1.7rem; line-height: 1; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="screens-viewport" id="screensViewport">
    <div class="screens" id="screens">

      <!-- Schermata 1: scrive una riga nel foglio Google -->
      <section class="screen" id="screenLog">
        <header>
          <h1>Allenamento</h1>
          <p class="subtitle">Registra la serie appena fatta</p>
        </header>

        <div class="notice" id="catalogNotice">
          <p id="catalogNoticeText"></p>
          <button type="button" id="retryCatalogBtn">Riprova</button>
        </div>

        <form id="logForm" novalidate>
          <div class="field">
            <label for="date">Data</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="field">
            <label for="muscleGroup">Gruppo muscolare</label>
            <select id="muscleGroup" name="muscleGroup" required></select>
          </div>

          <div class="field">
            <label for="exercise">Esercizio</label>
            <select id="exercise" name="exercise" required></select>
          </div>

          <div class="field">
            <label for="repetitions">Ripetizioni per set</label>
            <input type="number" id="repetitions" name="repetitions" placeholder="Es. 10" inputmode="numeric" min="1" step="1" required>
          </div>

          <div class="field">
            <label for="sets">Set</label>
            <input type="number" id="sets" name="sets" placeholder="Es. 4" inputmode="numeric" min="1" step="1" required>
          </div>

          <div class="field weight-row">
            <label for="weight">
              Peso (kg)
              <input type="number" id="weight" name="weight" placeholder="Es. 20" inputmode="decimal" min="0" step="0.5">
            </label>
            <label class="checkbox-label" for="mono">
              <input type="checkbox" id="mono" name="mono">
              Mono
            </label>
          </div>

          <div class="field">
            <label for="comment">Commento</label>
            <textarea id="comment" name="comment" placeholder="Es. Ultimo set impegnativo" maxlength="500"></textarea>
          </div>

          <button type="submit" id="submitBtn">Salva serie</button>

          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- Schermata 2: modifica i menu usati dalla schermata 1 -->
      <section class="screen" id="screenExercises">
        <header>
          <h1>Esercizi</h1>
          <p class="subtitle">Modifica i menu della schermata Allenamento</p>
        </header>

        <div class="field add-row">
          <input type="text" id="newGroup" maxlength="80" placeholder="Nuovo gruppo muscolare" aria-label="Nuovo gruppo muscolare">
          <button type="button" id="addGroupBtn">Aggiungi</button>
        </div>

        <p id="exerciseStatus" role="status" aria-live="polite"></p>

        <div id="exerciseGroups"></div>

        <details class="settings">
          <summary>Collegamento a Google Sheets</summary>
          <p>Incolla qui l'URL del deploy Apps Script (termina con <code>/exec</code>). Il deploy deve essere eseguito come te e accessibile a "Chiunque".</p>
          <div class="add-row">
            <input type="url" id="endpointUrl" placeholder="https://script.google.com/macros/s/.../exec" aria-label="URL del deploy Apps Script" autocomplete="off" spellcheck="false">
            <button type="button" id="saveEndpointBtn">Salva</button>
          </div>
          <p id="endpointStatus" role="status" aria-live="polite"></p>
        </details>
      </section>

    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button type="button" class="nav-btn active" data-screen="0" aria-current="page" aria-label="Allenamento">
      <span class="nav-icon" aria-hidden="true">➕</span>
    </button>
    <button type="button" class="nav-btn" data-screen="1" aria-current="false" aria-label="Esercizi">
      <span class="nav-icon" aria-hidden="true">✏️</span>
    </button>
  </nav>
</div>

<script>
(() => {
  'use strict';

  // URL del deploy di Google Apps Script (termina con /exec).
  // Puo essere sostituito a runtime dalla sezione "Collegamento a Google Sheets".
  const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwnGB1tYuHTDhFOWkRgH_1KOf090LG6k_0-RS2veVkWsAWBnc6ZXwkztfsV09syZFhRJA/exec';

  const URL_KEY = 'allenamento:scriptUrl';
  const CATALOG_KEY = 'allenamento:catalog';

  const $ = (id) => document.getElementById(id);

  const form = $('logForm');
  const submitBtn = $('submitBtn');
  const status = $('status');
  const dateInput = $('date');
  const muscleGroupInput = $('muscleGroup');
  const exerciseInput = $('exercise');
  const repetitionsInput = $('repetitions');
  const setsInput = $('sets');
  const weightInput = $('weight');
  const monoInput = $('mono');
  const commentInput = $('comment');

  const catalogNotice = $('catalogNotice');
  const catalogNoticeText = $('catalogNoticeText');
  const retryCatalogBtn = $('retryCatalogBtn');

  const screenExercises = $('screenExercises');
  const exerciseGroups = $('exerciseGroups');
  const exerciseStatus = $('exerciseStatus');
  const newGroupInput = $('newGroup');
  const addGroupBtn = $('addGroupBtn');

  const endpointUrlInput = $('endpointUrl');
  const saveEndpointBtn = $('saveEndpointBtn');
  const endpointStatus = $('endpointStatus');

  /* ------------------------------------------------ memoria locale (PWA) */

  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* quota o modalita privata */ } }
  };

  let scriptUrl = (store.get(URL_KEY) || DEFAULT_SCRIPT_URL).trim();
  let catalog = { groups: [] };
  let catalogLoaded = false;

  /* ------------------------------------------------------------- stato UI */

  const statusTimers = new WeakMap();

  const showStatus = (el, kind, message, timeout) => {
    clearTimeout(statusTimers.get(el));
    el.className = kind;
    el.textContent = message;
    if (timeout !== 0) {
      statusTimers.set(el, setTimeout(() => {
        el.textContent = '';
        el.className = '';
      }, timeout || 4000));
    }
  };

  const showNotice = (message) => {
    catalogNoticeText.textContent = message;
    catalogNotice.classList.add('visible');
  };

  const hideNotice = () => catalogNotice.classList.remove('visible');

  /* ------------------------------------------------------- chiamate di rete */

  const isConfigured = () => /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(scriptUrl);

  const requestJson = async (url, options) => {
    let response;
    try {
      response = await fetch(url, options);
    } catch (e) {
      throw new Error('Google Sheets non raggiungibile: controlla la connessione');
    }

    let text;
    try {
      text = await response.text();
    } catch (e) {
      throw new Error('Risposta interrotta da Google Sheets');
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      if (/accounts\.google\.com|ServiceLogin|Accedi con Google/i.test(text)) {
        throw new Error('Il deploy Apps Script non è pubblico: impostalo su "Chiunque"');
      }
      throw new Error('Risposta non valida da Google Sheets (HTTP ' + response.status + '). Controlla il link del deploy.');
    }

    if (!response.ok || data.result !== 'success') {
      throw new Error(data.message || 'Google Sheets ha rifiutato la richiesta (HTTP ' + response.status + ')');
    }

    return data;
  };

  /* ---------------------------------------------------------- catalogo menu */

  // Accetta sia il formato nuovo {groups:[{name,exercises}]} sia il vecchio
  // {Gruppo:[esercizi]}, cosi un deploy non ancora aggiornato resta leggibile.
  const normalizeCatalog = (raw) => {
    if (!raw || typeof raw !== 'object') return { groups: [] };

    const source = Array.isArray(raw.groups)
      ? raw.groups
      : Object.keys(raw).map((name) => ({ name, exercises: raw[name] }));

    const groups = [];
    source.forEach((group) => {
      if (!group || typeof group.name !== 'string') return;
      const name = group.name.trim();
      if (!name || groups.some((g) => g.name === name)) return;

      const exercises = Array.isArray(group.exercises)
        ? group.exercises
            .map((exercise) => (typeof exercise === 'string' ? exercise.trim() : ''))
            .filter((exercise, index, list) => exercise && list.indexOf(exercise) === index)
        : [];

      groups.push({ name, exercises });
    });

    return { groups };
  };

  const findGroup = (name) => catalog.groups.filter((group) => group.name === name)[0] || null;

  const applyCatalog = (raw, options) => {
    catalog = normalizeCatalog(raw);
    catalogLoaded = true;
    if (!options || options.persist !== false) {
      store.set(CATALOG_KEY, JSON.stringify(catalog));
    }
    renderGroupSelect();
    updateExerciseOptions();
    renderManager();
    refreshNotice();
  };

  const refreshNotice = () => {
    if (!isConfigured()) {
      showNotice('Collegamento a Google Sheets non configurato: apri la schermata Esercizi e incolla l’URL del deploy.');
      return;
    }
    if (!catalog.groups.length) {
      showNotice(catalogLoaded
        ? 'Nessun gruppo nel catalogo: creane uno dalla schermata Esercizi.'
        : 'Menu non caricati da Google Sheets.');
      return;
    }
    hideNotice();
  };

  const loadCatalog = async (options) => {
    const silent = options && options.silent;
    if (!isConfigured()) {
      refreshNotice();
      return false;
    }
    if (!silent) showStatus(exerciseStatus, 'pending', 'Caricamento menu…', 0);
    try {
      const data = await requestJson(scriptUrl + '?action=listExercises', { method: 'GET' });
      applyCatalog(data.catalog || data.exercises);
      if (!silent) showStatus(exerciseStatus, 'success', 'Menu aggiornati');
      return true;
    } catch (err) {
      showNotice(err.message);
      if (!silent) showStatus(exerciseStatus, 'error', err.message, 6000);
      return false;
    }
  };

  const catalogAction = async (action, payload) => {
    if (!isConfigured()) {
      showStatus(exerciseStatus, 'error', 'Configura prima l’URL del deploy Apps Script', 6000);
      return false;
    }

    showStatus(exerciseStatus, 'pending', 'Aggiornamento in corso…', 0);
    try {
      const data = await requestJson(scriptUrl, {
        method: 'POST',
        // text/plain evita la preflight CORS che Apps Script non gestisce
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action }, payload))
      });
      applyCatalog(data.catalog || data.exercises);
      showStatus(exerciseStatus, 'success', data.message || 'Aggiornato');
      return true;
    } catch (err) {
      showStatus(exerciseStatus, 'error', err.message, 6000);
      return false;
    }
  };

  /* ------------------------------------------- menu della prima schermata */

  const fillSelect = (select, values, placeholderText, selected) => {
    select.innerHTML = '';

    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.disabled = true;
    placeholder.textContent = placeholderText;
    select.appendChild(placeholder);

    values.forEach((value) => {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });

    if (selected && values.indexOf(selected) !== -1) select.value = selected;
    else placeholder.selected = true;

    select.disabled = values.length === 0;
  };

  const renderGroupSelect = () => {
    const names = catalog.groups.map((group) => group.name);
    fillSelect(
      muscleGroupInput,
      names,
      names.length ? 'Scegli un gruppo' : 'Nessun gruppo: creane uno in Esercizi',
      muscleGroupInput.value
    );
  };

  const updateExerciseOptions = () => {
    const group = findGroup(muscleGroupInput.value);
    const exercises = group ? group.exercises : [];
    const placeholder = !muscleGroupInput.value
      ? 'Scegli prima un gruppo'
      : (exercises.length ? 'Scegli un esercizio' : 'Nessun esercizio in questo gruppo');

    fillSelect(exerciseInput, exercises, placeholder, exerciseInput.value);
  };

  /* --------------------------------------- seconda schermata: editor menu */

  const iconButton = (label, glyph, className, onClick) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon-button ' + className;
    button.textContent = glyph;
    button.setAttribute('aria-label', label);
    button.addEventListener('click', onClick);
    return button;
  };

  const buildExerciseItem = (groupName, exercise) => {
    const item = document.createElement('li');

    const renderView = () => {
      item.innerHTML = '';
      const name = document.createElement('span');
      name.className = 'exercise-name';
      name.textContent = exercise;

      const actions = document.createElement('span');
      actions.className = 'row-actions';
      actions.append(
        iconButton('Rinomina ' + exercise, '✏️', 'edit', renderEdit),
        iconButton('Elimina ' + exercise, '🗑️', 'danger', () => {
          catalogAction('deleteExercise', { gruppoMuscolare: groupName, esercizio: exercise });
        })
      );

      item.append(name, actions);
    };

    const renderEdit = () => {
      item.innerHTML = '';
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 80;
      input.value = exercise;
      input.setAttribute('aria-label', 'Nuovo nome per ' + exercise);

      const save = () => {
        const newName = input.value.trim();
        if (!newName || newName === exercise) { renderView(); return; }
        catalogAction('renameExercise', {
          gruppoMuscolare: groupName,
          esercizio: exercise,
          nuovoEsercizio: newName
        });
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); save(); }
        if (e.key === 'Escape') renderView();
      });

      const actions = document.createElement('span');
      actions.className = 'row-actions';
      actions.append(
        iconButton('Salva ' + exercise, '✓', 'confirm', save),
        iconButton('Annulla modifica', '✕', 'cancel', renderView)
      );

      item.append(input, actions);
      input.focus();
      input.select();
    };

    renderView();
    return item;
  };

  const buildGroupCard = (group) => {
    const card = document.createElement('section');
    card.className = 'group-card';

    const header = document.createElement('div');
    header.className = 'group-header';

    const renderHeaderView = () => {
      header.innerHTML = '';
      const heading = document.createElement('h2');
      heading.className = 'group-name';
      heading.textContent = group.name;

      const actions = document.createElement('span');
      actions.className = 'row-actions';
      actions.append(
        iconButton('Rinomina il gruppo ' + group.name, '✏️', 'edit', renderHeaderEdit),
        iconButton('Elimina il gruppo ' + group.name, '🗑️', 'danger', () => {
          const extra = group.exercises.length
            ? ' e i suoi ' + group.exercises.length + ' esercizi'
            : '';
          if (!window.confirm('Eliminare il gruppo "' + group.name + '"' + extra + '?')) return;
          catalogAction('deleteGroup', { gruppoMuscolare: group.name });
        })
      );

      header.append(heading, actions);
    };

    const renderHeaderEdit = () => {
      header.innerHTML = '';
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 80;
      input.value = group.name;
      input.setAttribute('aria-label', 'Nuovo nome per il gruppo ' + group.name);

      const save = () => {
        const newName = input.value.trim();
        if (!newName || newName === group.name) { renderHeaderView(); return; }
        catalogAction('renameGroup', { gruppoMuscolare: group.name, nuovoGruppo: newName });
      };

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); save(); }
        if (e.key === 'Escape') renderHeaderView();
      });

      const actions = document.createElement('span');
      actions.className = 'row-actions';
      actions.append(
        iconButton('Salva il gruppo', '✓', 'confirm', save),
        iconButton('Annulla modifica', '✕', 'cancel', renderHeaderView)
      );

      header.append(input, actions);
      input.focus();
      input.select();
    };

    renderHeaderView();
    card.appendChild(header);

    if (group.exercises.length) {
      const list = document.createElement('ul');
      list.className = 'exercise-list';
      group.exercises.forEach((exercise) => list.appendChild(buildExerciseItem(group.name, exercise)));
      card.appendChild(list);
    } else {
      const empty = document.createElement('p');
      empty.className = 'group-empty';
      empty.textContent = 'Nessun esercizio';
      card.appendChild(empty);
    }

    const addRow = document.createElement('div');
    addRow.className = 'add-row';

    const addInput = document.createElement('input');
    addInput.type = 'text';
    addInput.maxLength = 80;
    addInput.placeholder = 'Nuovo esercizio';
    addInput.setAttribute('aria-label', 'Nuovo esercizio per ' + group.name);

    const addButton = document.createElement('button');
    addButton.type = 'button';
    addButton.textContent = 'Aggiungi';

    const submitExercise = async () => {
      const exercise = addInput.value.trim();
      if (!exercise) { addInput.focus(); return; }
      addButton.disabled = true;
      const ok = await catalogAction('saveExercise', { gruppoMuscolare: group.name, esercizio: exercise });
      addButton.disabled = false;
      if (!ok) addInput.value = exercise;
    };

    addInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitExercise(); }
    });
    addButton.addEventListener('click', submitExercise);

    addRow.append(addInput, addButton);
    card.appendChild(addRow);

    return card;
  };

  const renderManager = () => {
    const scrollTop = screenExercises.scrollTop;
    exerciseGroups.innerHTML = '';

    if (!catalog.groups.length) {
      const empty = document.createElement('p');
      empty.className = 'group-empty';
      empty.textContent = catalogLoaded
        ? 'Nessun gruppo. Aggiungine uno qui sopra: comparirà subito nel menu della schermata Allenamento.'
        : 'Menu non ancora caricati da Google Sheets.';
      exerciseGroups.appendChild(empty);
      return;
    }

    catalog.groups.forEach((group) => exerciseGroups.appendChild(buildGroupCard(group)));
    screenExercises.scrollTop = scrollTop;
  };

  const addGroup = async () => {
    const name = newGroupInput.value.trim();
    if (!name) { newGroupInput.focus(); return; }
    addGroupBtn.disabled = true;
    const ok = await catalogAction('saveGroup', { gruppoMuscolare: name });
    addGroupBtn.disabled = false;
    if (ok) newGroupInput.value = '';
  };

  addGroupBtn.addEventListener('click', addGroup);
  newGroupInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); addGroup(); }
  });

  /* -------------------------------------------- configurazione endpoint */

  endpointUrlInput.value = scriptUrl;

  saveEndpointBtn.addEventListener('click', async () => {
    const value = endpointUrlInput.value.trim();
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(value)) {
      showStatus(endpointStatus, 'error', 'Serve un URL del tipo https://script.google.com/macros/s/.../exec', 6000);
      return;
    }

    scriptUrl = value;
    store.set(URL_KEY, value);
    endpointUrlInput.value = value;
    showStatus(endpointStatus, 'pending', 'Verifica in corso…', 0);

    const ok = await loadCatalog({ silent: true });
    showStatus(
      endpointStatus,
      ok ? 'success' : 'error',
      ok ? 'Collegamento riuscito' : 'Collegamento salvato, ma la verifica è fallita',
      6000
    );
  });

  /* ---------------------------------------- prima schermata: salvataggio */

  const getToday = () => {
    const today = new Date();
    const offset = today.getTimezoneOffset() * 60000;
    return new Date(today.getTime() - offset).toISOString().slice(0, 10);
  };

  const resetDate = () => { dateInput.value = getToday(); };

  muscleGroupInput.addEventListener('change', updateExerciseOptions);
  retryCatalogBtn.addEventListener('click', () => loadCatalog());

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const payload = {
      data: dateInput.value,
      gruppoMuscolare: muscleGroupInput.value,
      esercizio: exerciseInput.value,
      ripetizioni: repetitionsInput.value,
      set: setsInput.value,
      peso: weightInput.value,
      mono: monoInput.checked,
      commento: commentInput.value.trim()
    };

    if (!isConfigured()) {
      showStatus(status, 'error', 'Configura l’URL del deploy nella schermata Esercizi', 6000);
      return;
    }

    if (!payload.data) { showStatus(status, 'error', 'Scegli una data'); dateInput.focus(); return; }
    if (!payload.gruppoMuscolare) { showStatus(status, 'error', 'Scegli un gruppo muscolare'); muscleGroupInput.focus(); return; }
    if (!payload.esercizio) { showStatus(status, 'error', 'Scegli un esercizio'); exerciseInput.focus(); return; }
    if (!payload.ripetizioni) { showStatus(status, 'error', 'Inserisci le ripetizioni'); repetitionsInput.focus(); return; }
    if (!payload.set) { showStatus(status, 'error', 'Inserisci i set'); setsInput.focus(); return; }

    submitBtn.disabled = true;
    showStatus(status, 'pending', 'Invio in corso…', 0);

    try {
      const data = await requestJson(scriptUrl, {
        method: 'POST',
        // text/plain evita la preflight CORS che Apps Script non gestisce
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      showStatus(status, 'success', data.message === 'Serie salvata' ? 'Salvato ✓' : data.message);

      // Data e gruppo restano: di solito si registra un altro esercizio dello stesso gruppo.
      exerciseInput.value = '';
      updateExerciseOptions();
      repetitionsInput.value = '';
      setsInput.value = '';
      weightInput.value = '';
      monoInput.checked = false;
      commentInput.value = '';
      if (!exerciseInput.disabled) exerciseInput.focus();
    } catch (err) {
      showStatus(status, 'error', err.message, 6000);
      console.error(err);
    } finally {
      submitBtn.disabled = false;
    }
  });

  /* ------------------------------------------------------- navigazione */

  const screens = $('screens');
  const screensViewport = $('screensViewport');
  const navButtons = document.querySelectorAll('.nav-btn');
  let currentScreen = 0;

  const setScreen = (index, animate = true) => {
    currentScreen = Math.max(0, Math.min(1, index));
    screens.style.transition = animate ? 'transform 0.3s ease' : 'none';
    screens.style.transform = 'translateX(' + (currentScreen * -50) + '%)';
    navButtons.forEach((navBtn) => {
      const isActive = Number(navBtn.dataset.screen) === currentScreen;
      navBtn.classList.toggle('active', isActive);
      navBtn.setAttribute('aria-current', isActive ? 'page' : 'false');
    });
  };

  navButtons.forEach((navBtn) => {
    navBtn.addEventListener('click', () => setScreen(Number(navBtn.dataset.screen)));
  });

  const isInteractive = (el) => !!(el && el.closest && el.closest('input, select, textarea, button, label, summary'));

  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let dragDeltaX = 0;
  let axisLocked = null;

  screensViewport.addEventListener('pointerdown', (e) => {
    if (isInteractive(e.target)) return;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dragDeltaX = 0;
    axisLocked = null;
    screens.style.transition = 'none';
  });

  screensViewport.addEventListener('pointermove', (e) => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (axisLocked === null) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (axisLocked === 'x') screensViewport.setPointerCapture(pointerId);
    }

    if (axisLocked !== 'x') return;

    if (e.cancelable) e.preventDefault();
    dragDeltaX = dx;
    const width = screensViewport.clientWidth || 1;
    const basePercent = currentScreen * -50;
    const nextPercent = Math.max(-50, Math.min(0, basePercent + (dragDeltaX / width) * 50));
    screens.style.transform = 'translateX(' + nextPercent + '%)';
  });

  const endDrag = (e) => {
    if (pointerId === null || (e && e.pointerId !== pointerId)) return;
    pointerId = null;
    if (axisLocked === 'x') {
      const width = screensViewport.clientWidth || 1;
      const threshold = width * 0.2;
      if (dragDeltaX < -threshold) setScreen(1);
      else if (dragDeltaX > threshold) setScreen(0);
      else setScreen(currentScreen);
    }
    axisLocked = null;
    dragDeltaX = 0;
  };

  screensViewport.addEventListener('pointerup', endDrag);
  screensViewport.addEventListener('pointercancel', endDrag);

  /* ------------------------------------------------------------ avvio */

  resetDate();

  // I menu salvati in locale compaiono subito, anche offline o prima della rete.
  const cached = store.get(CATALOG_KEY);
  if (cached) {
    try {
      applyCatalog(JSON.parse(cached), { persist: false });
    } catch (e) {
      renderGroupSelect();
      updateExerciseOptions();
      renderManager();
    }
  } else {
    renderGroupSelect();
    updateExerciseOptions();
    renderManager();
  }

  refreshNotice();
  loadCatalog({ silent: true });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }
})();
</script>

</body>
</html>
