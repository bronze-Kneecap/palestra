<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Allenamento Log</title>
<meta name="description" content="Registra rapidamente esercizi e ripetizioni durante l'allenamento.">

<!-- Tema browser -->
<meta name="theme-color" content="#161A20">

<!-- iOS: esecuzione a schermo intero come app -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Allenamento">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- Android / PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #161A20;
    --text: #EDEDE6;
    --muted: #8A8F98;
    --line: #333A44;
    --accent: #4C7BFF;
    --success: #4CD787;
    --error: #FF6B6B;
    --nav-height: 64px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    max-width: 420px;
    margin: 0 auto;
  }

  header { margin-bottom: 32px; }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
  }

  .subtitle { margin: 0; color: var(--muted); font-size: 0.95rem; }

  .field { margin-bottom: 28px; }

  label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    color: var(--text);
    font-size: 1.25rem;
    padding: 8px 2px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  textarea {
    width: 100%;
    min-height: 84px;
    resize: vertical;
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 1rem;
    padding: 10px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  select {
    width: 100%;
    appearance: none;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--line);
    color: var(--text);
    font-size: 1.1rem;
    padding: 8px 2px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  select:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  select:disabled { color: var(--muted); }

  .exercise-tools { display: flex; justify-content: flex-end; margin-top: 10px; }
  .text-button {
    width: auto; min-height: 0; padding: 0; border-radius: 0;
    background: transparent; color: var(--accent); font-family: inherit; font-size: 0.85rem;
  }
  .text-button:active { transform: none; opacity: 0.75; }

  .manager-row { display: flex; align-items: flex-end; gap: 10px; }
  .manager-row label { flex: 1; }
  .manager-row input { font-size: 1rem; }
  .manager-row button { width: auto; min-height: 42px; padding: 10px 14px; border-radius: 8px; }

  .group-section { margin-bottom: 26px; }
  .group-heading {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    margin: 0 0 10px;
  }
  .group-empty { margin: 0; color: var(--muted); font-size: 0.85rem; }

  .exercise-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
  .exercise-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    color: var(--text);
    font-size: 0.95rem;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
  }
  .exercise-list li input[type="text"] { flex: 1; font-size: 0.95rem; padding: 4px 2px; }
  .exercise-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-button {
    width: 34px;
    min-height: 34px;
    padding: 0;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1;
  }
  .icon-button:active { transform: scale(0.94); }
  .icon-button.delete-exercise { color: var(--error); border-color: var(--error); }
  .icon-button.save-exercise { color: var(--success); border-color: var(--success); }

  input:focus {
    outline: none;
    border-bottom-color: var(--accent);
  }

  textarea:focus {
    outline: none;
    border-color: var(--accent);
  }

  .weight-row {
    display: flex;
    align-items: flex-end;
    gap: 20px;
  }

  .weight-row > label:first-child {
    flex: 1;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
  }

  .checkbox-label input {
    width: 18px;
    height: 18px;
    margin: 0;
    accent-color: var(--accent);
  }

  input::placeholder,
  textarea::placeholder { color: #4A505A; }

  button {
    width: 100%;
    min-height: 52px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: var(--accent);
    color: #0B0D11;
    font-size: 1rem;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }

  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  #status, #exerciseStatus {
    text-align: center;
    min-height: 20px;
    margin-top: 16px;
    font-size: 0.9rem;
  }
  .pending { color: var(--muted); }
  .success { color: var(--success); }
  .error { color: var(--error); }

  /* Schermate affiancate: "Allenamento" e "Esercizi" a destra, navigabili con swipe o bottom nav */
  .screens-viewport {
    flex: 1;
    overflow: hidden;
    touch-action: pan-y;
  }

  .screens {
    display: flex;
    width: 200%;
    height: 100%;
    transition: transform 0.3s ease;
  }

  .screen {
    width: 50%;
    height: 100%;
    flex-shrink: 0;
    overflow-y: auto;
    padding:
      max(24px, env(safe-area-inset-top))
      max(24px, env(safe-area-inset-right))
      24px
      max(24px, env(safe-area-inset-left));
  }

  .bottom-nav {
    display: flex;
    flex-shrink: 0;
    border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
    background: var(--bg);
  }

  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: var(--nav-height);
    padding: 8px 0;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
  }

  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 1.7rem; line-height: 1; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="screens-viewport" id="screensViewport">
    <div class="screens" id="screens">

      <section class="screen" id="screenLog">
        <header>
          <h1>Allenamento</h1>
          <p class="subtitle">Registra la serie appena fatta</p>
        </header>

        <form id="logForm" novalidate>
          <div class="field">
            <label for="date">Data</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="field">
            <label for="muscleGroup">Gruppo muscolare</label>
            <select id="muscleGroup" name="muscleGroup" required>
              <option value="" selected disabled>Scegli un gruppo</option>
              <option value="Spalle">Spalle</option>
              <option value="Petto">Petto</option>
              <option value="Gambe">Gambe</option>
              <option value="Braccia">Braccia</option>
              <option value="Addome">Addome</option>
              <option value="Dorso">Dorso</option>
            </select>
          </div>

          <div class="field">
            <label for="exercise">Esercizio</label>
            <select id="exercise" name="exercise" required disabled>
              <option value="" selected disabled>Scegli prima un gruppo</option>
            </select>
            <div class="exercise-tools">
              <button type="button" class="text-button" id="manageExercisesBtn">Gestisci esercizi</button>
            </div>
          </div>

          <div class="field">
            <label for="repetitions">Ripetizioni per set</label>
            <input type="number" id="repetitions" name="repetitions" placeholder="Es. 10" inputmode="numeric" min="1" step="1" required>
          </div>

          <div class="field">
            <label for="sets">Set</label>
            <input type="number" id="sets" name="sets" placeholder="Es. 4" inputmode="numeric" min="1" step="1" required>
          </div>

          <div class="field weight-row">
            <label for="weight">
              Peso (kg)
              <input type="number" id="weight" name="weight" placeholder="Es. 20" inputmode="decimal" min="0" step="0.5">
            </label>
            <label class="checkbox-label" for="mono">
              <input type="checkbox" id="mono" name="mono">
              Mono
            </label>
          </div>

          <div class="field">
            <label for="comment">Commento</label>
            <textarea id="comment" name="comment" placeholder="Es. Ultimo set impegnativo" maxlength="500"></textarea>
          </div>

          <button type="submit" id="submitBtn">Salva serie</button>

          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="screen" id="screenExercises">
        <header>
          <h1>Esercizi</h1>
          <p class="subtitle">Crea, modifica o elimina gli esercizi del catalogo</p>
        </header>

        <div class="field">
          <label for="newExerciseGroup">Aggiungi a</label>
          <select id="newExerciseGroup">
            <option value="Spalle">Spalle</option>
            <option value="Petto">Petto</option>
            <option value="Gambe">Gambe</option>
            <option value="Braccia">Braccia</option>
            <option value="Addome">Addome</option>
            <option value="Dorso">Dorso</option>
          </select>
        </div>

        <div class="field manager-row">
          <label for="newExercise">Nuovo esercizio
            <input type="text" id="newExercise" maxlength="80" placeholder="Es. Trazioni">
          </label>
          <button type="button" id="addExerciseBtn">Aggiungi</button>
        </div>

        <p id="exerciseStatus" role="status" aria-live="polite"></p>

        <div id="exerciseGroups"></div>
      </section>

    </div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button type="button" class="nav-btn active" data-screen="0" aria-current="page" aria-label="Allenamento">
      <span class="nav-icon" aria-hidden="true">➕</span>
    </button>
    <button type="button" class="nav-btn" data-screen="1" aria-current="false" aria-label="Esercizi">
      <span class="nav-icon" aria-hidden="true">✏️</span>
    </button>
  </nav>
</div>

<script>
  // Sostituisci con l'URL del tuo deploy di Google Apps Script (termina con /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwnGB1tYuHTDhFOWkRgH_1KOf090LG6k_0-RS2veVkWsAWBnc6ZXwkztfsV09syZFhRJA/exec";

  const form = document.getElementById('logForm');
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');
  const dateInput = document.getElementById('date');
  const muscleGroupInput = document.getElementById('muscleGroup');
  const exerciseInput = document.getElementById('exercise');
  const manageExercisesBtn = document.getElementById('manageExercisesBtn');
  const newExerciseGroup = document.getElementById('newExerciseGroup');
  const newExerciseInput = document.getElementById('newExercise');
  const addExerciseBtn = document.getElementById('addExerciseBtn');
  const exerciseGroups = document.getElementById('exerciseGroups');
  const exerciseStatus = document.getElementById('exerciseStatus');
  const MUSCLE_GROUPS = ['Spalle', 'Petto', 'Gambe', 'Braccia', 'Addome', 'Dorso'];
  const repetitionsInput = document.getElementById('repetitions');
  const setsInput = document.getElementById('sets');
  const weightInput = document.getElementById('weight');
  const monoInput = document.getElementById('mono');
  const commentInput = document.getElementById('comment');
  let statusTimer = null;
  let exerciseStatusTimer = null;

  let exercisesByGroup = {
    Spalle: ['Military press', 'Alzate laterali', 'Alzate frontali', 'Reverse fly'],
    Petto: ['Panca piana', 'Panca inclinata', 'Chest press', 'Croci'],
    Gambe: ['Squat', 'Leg press', 'Affondi', 'Leg extension', 'Leg curl'],
    Braccia: ['Curl con bilanciere', 'Curl con manubri', 'Pushdown', 'French press'],
    Addome: ['Crunch', 'Plank', 'Leg raise', 'Ab wheel'],
    Dorso: ['Stacco da terra', 'Lat machine', 'Rematore', 'Pulley']
  };

  const getToday = () => {
    const today = new Date();
    const offset = today.getTimezoneOffset() * 60000;
    return new Date(today.getTime() - offset).toISOString().slice(0, 10);
  };

  const resetDate = () => {
    dateInput.value = getToday();
  };

  const setExercises = (exercises) => {
    exercisesByGroup = exercises || {};
    updateExerciseOptions();
    renderAllGroups();
  };

  const updateExerciseOptions = () => {
    const exercises = exercisesByGroup[muscleGroupInput.value] || [];
    exerciseInput.innerHTML = '<option value="" selected disabled>Scegli un esercizio</option>';
    exercises.forEach((exercise) => {
      const option = document.createElement('option');
      option.value = exercise;
      option.textContent = exercise;
      exerciseInput.appendChild(option);
    });
    exerciseInput.disabled = exercises.length === 0;
  };

  const callExerciseAction = async (action, payload) => {
    clearTimeout(exerciseStatusTimer);
    exerciseStatus.className = 'pending';
    exerciseStatus.textContent = 'Aggiornamento in corso…';
    let success = false;
    try {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action, ...payload })
      });
      const data = await response.json();
      if (!response.ok || data.result !== 'success') throw new Error(data.message || 'Impossibile aggiornare gli esercizi');
      setExercises(data.exercises);
      exerciseStatus.className = 'success';
      exerciseStatus.textContent = data.message;
      success = true;
    } catch (err) {
      exerciseStatus.className = 'error';
      exerciseStatus.textContent = err.message;
    } finally {
      exerciseStatusTimer = setTimeout(() => { exerciseStatus.textContent = ''; exerciseStatus.className = ''; }, 3000);
    }
    return success;
  };

  const buildExerciseItem = (group, exercise) => {
    const item = document.createElement('li');

    const renderView = () => {
      item.innerHTML = '';
      const name = document.createElement('span');
      name.textContent = exercise;

      const actions = document.createElement('span');
      actions.className = 'exercise-actions';

      const editButton = document.createElement('button');
      editButton.type = 'button';
      editButton.className = 'icon-button edit-exercise';
      editButton.textContent = '✏️';
      editButton.setAttribute('aria-label', `Modifica ${exercise}`);
      editButton.addEventListener('click', renderEdit);

      const deleteButton = document.createElement('button');
      deleteButton.type = 'button';
      deleteButton.className = 'icon-button delete-exercise';
      deleteButton.textContent = '🗑️';
      deleteButton.setAttribute('aria-label', `Rimuovi ${exercise}`);
      deleteButton.addEventListener('click', () => callExerciseAction('deleteExercise', { gruppoMuscolare: group, esercizio: exercise }));

      actions.append(editButton, deleteButton);
      item.append(name, actions);
    };

    const renderEdit = () => {
      item.innerHTML = '';
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 80;
      input.value = exercise;

      const actions = document.createElement('span');
      actions.className = 'exercise-actions';

      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.className = 'icon-button save-exercise';
      saveButton.textContent = '✓';
      saveButton.setAttribute('aria-label', `Salva ${exercise}`);
      saveButton.addEventListener('click', () => {
        const newName = input.value.trim();
        if (!newName || newName === exercise) { renderView(); return; }
        callExerciseAction('renameExercise', { gruppoMuscolare: group, esercizio: exercise, nuovoEsercizio: newName });
      });

      const cancelButton = document.createElement('button');
      cancelButton.type = 'button';
      cancelButton.className = 'icon-button cancel-exercise';
      cancelButton.textContent = '✕';
      cancelButton.setAttribute('aria-label', 'Annulla modifica');
      cancelButton.addEventListener('click', renderView);

      actions.append(saveButton, cancelButton);
      item.append(input, actions);
      input.focus();
      input.select();
    };

    renderView();
    return item;
  };

  const renderAllGroups = () => {
    exerciseGroups.innerHTML = '';
    MUSCLE_GROUPS.forEach((group) => {
      const section = document.createElement('section');
      section.className = 'group-section';

      const heading = document.createElement('h2');
      heading.className = 'group-heading';
      heading.textContent = group;
      section.appendChild(heading);

      const exercises = exercisesByGroup[group] || [];
      if (exercises.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'group-empty';
        empty.textContent = 'Nessun esercizio';
        section.appendChild(empty);
      } else {
        const list = document.createElement('ul');
        list.className = 'exercise-list';
        exercises.forEach((exercise) => list.appendChild(buildExerciseItem(group, exercise)));
        section.appendChild(list);
      }

      exerciseGroups.appendChild(section);
    });
  };

  muscleGroupInput.addEventListener('change', updateExerciseOptions);

  renderAllGroups();

  addExerciseBtn.addEventListener('click', async () => {
    const exercise = newExerciseInput.value.trim();
    if (!exercise) return;
    addExerciseBtn.disabled = true;
    const success = await callExerciseAction('saveExercise', { gruppoMuscolare: newExerciseGroup.value, esercizio: exercise });
    addExerciseBtn.disabled = false;
    if (success) newExerciseInput.value = '';
  });

  fetch(`${SCRIPT_URL}?action=listExercises`)
    .then((response) => response.json())
    .then((data) => {
      if (data.result === 'success') setExercises(data.exercises);
    })
    .catch((error) => console.error('Catalogo esercizi non disponibile', error));

  resetDate();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = dateInput.value;
    const gruppoMuscolare = muscleGroupInput.value;
    const esercizio = exerciseInput.value;
    const ripetizioni = repetitionsInput.value;
    const set = setsInput.value;
    const peso = weightInput.value;
    const mono = monoInput.checked;
    const commento = commentInput.value.trim();
    if (!data || !gruppoMuscolare || !esercizio || !ripetizioni || !set) return;

    clearTimeout(statusTimer);
    btn.disabled = true;
    status.className = 'pending';
    status.textContent = 'Invio in corso…';

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        // text/plain evita la preflight CORS che Apps Script non gestisce
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ data, gruppoMuscolare, esercizio, ripetizioni, set, peso, mono, commento })
      });

      const responseText = await res.text();
      let responseData;

      try {
        responseData = JSON.parse(responseText);
      } catch {
        throw new Error(`Google Sheets ha restituito una risposta non valida (HTTP ${res.status})`);
      }

      if (!res.ok) {
        throw new Error(responseData.message || `Google Sheets ha rifiutato la richiesta (HTTP ${res.status})`);
      }

      if (responseData.result === 'success') {
        status.className = 'success';
        status.textContent = 'Salvato ✓';
        form.reset();
        exerciseInput.innerHTML = '<option value="" selected disabled>Scegli prima un gruppo</option>';
        exerciseInput.disabled = true;
        resetDate();
        exerciseInput.focus();
      } else {
        throw new Error(responseData.message || 'Google Sheets non ha confermato il salvataggio');
      }
    } catch (err) {
      status.className = 'error';
      status.textContent = err instanceof TypeError
        ? 'Collegamento a Google Sheets non disponibile'
        : err.message;
      console.error(err);
    } finally {
      btn.disabled = false;
      statusTimer = setTimeout(() => {
        status.textContent = '';
        status.className = '';
      }, 3000);
    }
  });

  // Navigazione tra le due schermate: bottom nav e swipe orizzontale
  const screens = document.getElementById('screens');
  const screensViewport = document.getElementById('screensViewport');
  const navButtons = document.querySelectorAll('.nav-btn');
  let currentScreen = 0;

  const setScreen = (index, animate = true) => {
    currentScreen = Math.max(0, Math.min(1, index));
    screens.style.transition = animate ? 'transform 0.3s ease' : 'none';
    screens.style.transform = `translateX(${currentScreen * -50}%)`;
    navButtons.forEach((navBtn) => {
      const isActive = Number(navBtn.dataset.screen) === currentScreen;
      navBtn.classList.toggle('active', isActive);
      navBtn.setAttribute('aria-current', isActive ? 'page' : 'false');
    });
  };

  navButtons.forEach((navBtn) => {
    navBtn.addEventListener('click', () => setScreen(Number(navBtn.dataset.screen)));
  });

  manageExercisesBtn.addEventListener('click', () => {
    if (muscleGroupInput.value) newExerciseGroup.value = muscleGroupInput.value;
    setScreen(1);
  });

  const isInteractive = (el) => !!el.closest('input, select, textarea, button, label');

  let pointerId = null;
  let startX = 0;
  let startY = 0;
  let dragDeltaX = 0;
  let axisLocked = null;

  screensViewport.addEventListener('pointerdown', (e) => {
    if (isInteractive(e.target)) return;
    pointerId = e.pointerId;
    startX = e.clientX;
    startY = e.clientY;
    dragDeltaX = 0;
    axisLocked = null;
    screens.style.transition = 'none';
  });

  screensViewport.addEventListener('pointermove', (e) => {
    if (pointerId === null || e.pointerId !== pointerId) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;

    if (axisLocked === null) {
      if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
      axisLocked = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      if (axisLocked === 'x') screensViewport.setPointerCapture(pointerId);
    }

    if (axisLocked !== 'x') return;

    e.preventDefault();
    dragDeltaX = dx;
    const width = screensViewport.clientWidth || 1;
    const basePercent = currentScreen * -50;
    const nextPercent = Math.max(-50, Math.min(0, basePercent + (dragDeltaX / width) * 50));
    screens.style.transform = `translateX(${nextPercent}%)`;
  });

  const endDrag = (e) => {
    if (pointerId === null || (e && e.pointerId !== pointerId)) return;
    pointerId = null;
    if (axisLocked === 'x') {
      const width = screensViewport.clientWidth || 1;
      const threshold = width * 0.2;
      if (dragDeltaX < -threshold) setScreen(1);
      else if (dragDeltaX > threshold) setScreen(0);
      else setScreen(currentScreen);
    }
    axisLocked = null;
    dragDeltaX = 0;
  };

  screensViewport.addEventListener('pointerup', endDrag);
  screensViewport.addEventListener('pointercancel', endDrag);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(console.error);
    });
  }
</script>
